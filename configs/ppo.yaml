# PPO settings. See ppo/config.py for field descriptions.

network:
  hidden_sizes: [128, 128]
  activation: tanh
  log_std_init: -0.7
  # Minimum action noise; null disables the limit.
  log_std_min: -1.3 
  # Initial [turn, throttle] mean; null uses the network default.
  mean_bias_init: [0.0, 0.5]
  # Keep mean actions within [-1, 1].
  tanh_mean: true

rollout:
  steps_per_epoch: 10000
  epochs: 1000
  # Discount horizon: 1 / (1 - gamma).
  gamma: 0.998
  gae_lambda: 0.98
  # Recent frames let the policy detect sensor changes.
  frame_stack: 4 
  # Keep sensor channels on similar scales.
  normalize_observations: true

optim:
  clip_ratio: 0.2
  policy_lr: 0.0003
  value_lr: 0.001
  policy_iters: 80        # upper bound; target_kl usually stops it sooner
  value_iters: 80
  target_kl: 0.015
  # Set to 0.0 to remove the entropy bonus.
  entropy_coef: 0.01 
  max_grad_norm: 0.5      # 0 disables clipping
  # Reduce learning rates linearly during training.
  anneal_lr: true

curriculum:
  # Move start values toward the environment config targets.
  enabled: false 
  anneal_fraction: 0.8    # reach the real world 80% in, then hold and consolidate
  food_count_start: 15
  eat_radius_start: 1.5
  scent_radius_start: 6.0
  # Reduce initial energy costs, then move the scale toward 1.
  metabolism_scale_start: 2.0

run:
  name: ppo
  seed: 0
  device: cpu             # networks this small are latency-bound; CPU usually wins
  output_dir: experiments
  save_every: 10
  log_every: 1
  # Evaluate on the target world with fixed seeds; 0 disables it.
  eval_every: 50
  eval_episodes: 100
