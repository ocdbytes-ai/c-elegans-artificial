# World v1 — point-worm, random food, scent field.
#
# This file is the complete set of tunables and mirrors the dataclass defaults
# in envs/config.py exactly (tests/test_env.py enforces that they stay in sync).
# Any YAML passed to the env may be partial — omitted keys fall back to these.
#
#   env = WormWorldEnv(config="configs/world_v1.yaml")

world:
  width: 20.0
  height: 20.0
  dt: 0.1
  # "wrap" = torus, no walls to get stuck against. "clamp" = hard edges.
  boundary: wrap

worm:
  max_speed: 2.0          # world units / second
  max_turn_rate: 3.0      # radians / second (~172 deg/s)
  allow_reverse: true     # C. elegans reverses; part of the pirouette
  radius: 0.25            # drawn size only

food:
  count: 8
  eat_radius: 0.4         # contact radius — touch it and it is eaten
  scent_radius: 4.0       # sensory radius — 10x the mouth, so it can be followed
  scent_peak: 1.0         # concentration at the exact centre of a pellet
  scent_profile: gaussian # gaussian | linear | inverse_square
  gaussian_sigma_scale: 0.35  # sigma = 0.35 * scent_radius -> ~1.7% of peak at the rim
  respawn_on_eat: true
  min_spawn_distance: 5.0 # do not spawn a pellet in the worm's mouth

metabolism:
  max_energy: 100.0
  initial_energy: 50.0
  # THE critical ratio. basal must dominate move, or freezing wins and PPO
  # stops exploring. Here: idle 0.25/step, full-effort 0.29/step (+16%).
  basal_cost: 0.25
  move_cost: 0.02         # multiplied by |action|^2, so at most 0.04
  food_value: 25.0        # one pellet buys 100 idle steps
  min_speed_factor: 0.35  # a starving worm is slow, never frozen
  speed_knee: 0.25        # above 25% energy, speed is unimpaired

reward:
  survival: 1.0           # +1 per surviving step. This is the whole reward.
  death_penalty: 0.0      # optional sharpening; keep at 0 for the headline run

observation:
  # Food is sensed as one scalar concentration at the head — never as a
  # direction or a distance. Stack frames on top to give it a time axis:
  #   FrameStackObservation(gym.make("WormWorld-v1"), stack_size=4)
  include_energy: true

render:
  window_size: 700
  fps: 30
  show_scent_field: true
  scent_grid: 96
  show_scent_rings: true
