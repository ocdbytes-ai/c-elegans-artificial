[project]
name = "ai-worm"
version = "0.1.0"
description = "C. Elegans. worm artifical clone"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3.0",
    "joblib>=1.5.3",
    "mpi4py>=4.1.2",
    "numpy>=2.4.6",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
]
